name: Build and verify Random Launcher v2

on:
  push:
    branches:
      - random-launcher-v2-verified

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand project
        run: |
          cat project.b64.part* > random-launcher-v2-project.zip.b64
          base64 --decode random-launcher-v2-project.zip.b64 > random-launcher-v2-project.zip
          mkdir project
          unzip -q random-launcher-v2-project.zip -d project

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Unit tests and debug build
        working-directory: project
        run: |
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Static APK verification
        working-directory: project
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.yeying.randomlauncher'" apk-badging.txt
          grep -q "launchable-activity: name='com.yeying.randomlauncher.MainActivity'" apk-badging.txt
          unzip -l "$APK" | tee apk-contents.txt
          grep -q "classes.dex" apk-contents.txt
          SIZE=$(stat -c%s "$APK")
          echo "Debug APK size: $SIZE bytes"
          test "$SIZE" -gt 500000

      - name: Android 13 emulator install and launch test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euxo pipefail
            cd project
            APK=app/build/outputs/apk/debug/app-debug.apk
            adb install -r "$APK"
            adb logcat -c
            adb shell am start -W -n com.yeying.randomlauncher/.MainActivity | tee start-result.txt
            grep -q "Status: ok" start-result.txt
            sleep 3
            adb shell pidof com.yeying.randomlauncher
            adb shell dumpsys activity activities | grep -q "com.yeying.randomlauncher"
            gradle --no-daemon :app:connectedDebugAndroidTest
            adb logcat -d > logcat.txt
            if grep -A12 -B4 "FATAL EXCEPTION" logcat.txt | grep -q "com.yeying.randomlauncher"; then
              cat logcat.txt
              exit 1
            fi
            adb shell dumpsys package com.yeying.randomlauncher | grep -E "versionName=|versionCode="

      - name: Build verified release APK
        working-directory: project
        run: |
          set -euxo pipefail
          gradle --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk RandomLauncher-v2.0.0-Android13-realme.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs RandomLauncher-v2.0.0-Android13-realme.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging RandomLauncher-v2.0.0-Android13-realme.apk | tee release-badging.txt
          unzip -t RandomLauncher-v2.0.0-Android13-realme.apk
          sha256sum RandomLauncher-v2.0.0-Android13-realme.apk > SHA256-v2.0.0.txt
          stat -c "Release APK size: %s bytes" RandomLauncher-v2.0.0-Android13-realme.apk

      - name: Upload verified build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RandomLauncher-v2.0.0-verified
          path: |
            project/RandomLauncher-v2.0.0-Android13-realme.apk
            project/SHA256-v2.0.0.txt
            project/release-badging.txt
            project/app/build/reports/androidTests/connected/
          if-no-files-found: error

      - name: Publish verified GitHub release
        working-directory: project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete random-launcher-v2.0.0 --repo ddddage/uplood --yes --cleanup-tag || true
          gh release create random-launcher-v2.0.0 --repo ddddage/uplood \
            RandomLauncher-v2.0.0-Android13-realme.apk \
            SHA256-v2.0.0.txt \
            release-badging.txt \
            --target random-launcher-v2-verified \
            --title "Random Launcher v2.0.0 — Android 13 verified" \
            --notes "Rebuilt as a standard AndroidX application. Verified by unit tests, APK signature and manifest checks, installation on an Android 13 emulator, real Activity launch, instrumentation UI smoke test, and fatal-crash log inspection."
