name: Publish Random Launcher v1.1 tested

on:
  push:
    branches:
      - random-launcher-v11-tested

permissions:
  contents: write

jobs:
  publish-v11:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact build artifact
        run: |
          curl -L --fail --retry 3 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-76c4-8211-bd67-1cb7fbe208f2/raw?se=2026-10-19T03%3A42%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=e9ff8576-7596-5c40-8c00-319409e72bd7&skoid=54865dd2-31dc-44cc-a877-635aa4250446&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-18T22%3A07%3A30Z&ske=2026-10-19T22%3A07%3A30Z&sks=b&skv=2026-02-06&sig=rfI1tRigEOT4PcHcTadL6MFNq5ZvnNV5cZLOphzoPrg%3D' -o artifact.zip
          unzip -o artifact.zip
          sha256sum RandomLauncher-v1.1-tested.apk
          test "$(sha256sum RandomLauncher-v1.1-tested.apk | awk '{print $1}')" = "5e5458595e6f965657c139dd8ca59c8fef10ee7adf60fed39855267e8f4c82d1"

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete random-launcher-v1.1-tested --repo ddddage/uplood --yes --cleanup-tag || true
          gh release create random-launcher-v1.1-tested --repo ddddage/uplood RandomLauncher-v1.1-tested.apk SHA256-v1.1.txt --target random-launcher-v11-tested --title "Random Launcher v1.1 tested" --notes "Android 13 tested build. SHA-256: 5e5458595e6f965657c139dd8ca59c8fef10ee7adf60fed39855267e8f4c82d1"
